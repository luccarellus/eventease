upstream nestjs_api {
    least_conn;
    server api:3000 max_fails=3 fail_timeout=30s;
}

# HTTP -> HTTPS Redirect
server {
    listen 80;
    server_name api.eventease.com; # Substituir pelo seu domínio
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.eventease.com; # Substituir pelo seu domínio

    # SSL (Certbot will manage these paths)
    ssl_certificate /etc/letsencrypt/live/api.eventease.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.eventease.com/privkey.pem;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; object-src 'none'; frame-ancestors 'none';" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        proxy_pass http://nestjs_api;
        proxy_http_version 1.1;
        
        # Websocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Rate Limiting (Opcional, configurado no NGINX global ou aqui)
        # limit_req zone=one burst=10 nodelay;
    }

    # Healthcheck direct access (Optional)
    location /health {
        proxy_pass http://nestjs_api/health;
        access_log off;
    }
}
