upstream nestjs_api {
    least_conn;
    server api:3000 max_fails=3 fail_timeout=30s;
}

upstream frontend_app {
    least_conn;
    server frontend:80 max_fails=3 fail_timeout=30s;
}

# HTTP — sem SSL por enquanto
server {
    listen 80;
    server_name 181.215.45.185 www.181.215.45.185;

    # Security Headers
    # (X-XSS-Protection foi removido: é obsoleto/depreciado pelos navegadores modernos)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Frontend
    location / {
        proxy_pass http://frontend_app;
        proxy_http_version 1.1;

        # Websocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API Backend — encaminha o caminho completo (a API já expõe as rotas
    # sob o prefixo /api, ex.: /api/events). NÃO remover o prefixo aqui.
    location /api/ {
        proxy_pass http://nestjs_api;
        proxy_http_version 1.1;

        # Websocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Healthcheck
    location /health {
        proxy_pass http://nestjs_api/api/health;
        access_log off;
    }
}

