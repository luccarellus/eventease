version: '3.8'

services:
  # NestJS API - Replicas managed by Docker Compose
  api:
    build:
      context: ./backend
      dockerfile: ../docker/api/Dockerfile
    image: eventease-api:latest
    restart: always
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL}
      - JWT_SECRET=${JWT_SECRET}
      - COOKIE_SECRET=${COOKIE_SECRET}
      - SUPABASE_URL=${SUPABASE_URL}
      - NODE_ENV=production
    command: >
      sh -c "npx prisma db push && node dist/main"
    networks:
      - backend_network
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend Application
  frontend:
    build:
      context: .
      dockerfile: ./docker/frontend/Dockerfile
      args:
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
    image: eventease-frontend:latest
    restart: always
    networks:
      - backend_network
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # NGINX Load Balancer
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
      - ./docker/nginx/ssl:/etc/nginx/ssl
      - /etc/letsencrypt:/etc/letsencrypt
    depends_on:
      - api
      - frontend
    networks:
      - backend_network
    restart: always

networks:
  backend_network:
    driver: bridge
