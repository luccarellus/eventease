version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:17-alpine
    container_name: eventease-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eventease}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-eventease}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Storage
  redis:
    image: redis:7-alpine
    container_name: eventease-redis
    restart: always
    command: sh -c "redis-server --save 60 1 --loglevel notice ${REDIS_PASSWORD:+--requirepass $REDIS_PASSWORD}"
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend_network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ${REDIS_PASSWORD:+-a $REDIS_PASSWORD} ping | grep PONG || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NestJS API
  api:
    build:
      context: ./backend
      dockerfile: ../docker/api/Dockerfile
    image: eventease-api:latest
    restart: always
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-eventease}
      - DIRECT_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-eventease}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - COOKIE_SECRET=${COOKIE_SECRET}
      - FRONTEND_URL=${FRONTEND_URL}
      - RECAPTCHA_SECRET_KEY=${RECAPTCHA_SECRET_KEY}
      - RECAPTCHA_MIN_SCORE=${RECAPTCHA_MIN_SCORE}
      - NEVAPRO_WEBHOOK_URL=${NEVAPRO_WEBHOOK_URL}
      - NEVAPRO_WEBHOOK_SECRET=${NEVAPRO_WEBHOOK_SECRET}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >-
      sh -c "npx prisma migrate deploy && node dist/main"
    networks:
      - backend_network
    deploy:
      # Obs: `deploy.replicas` só é aplicado em modo Swarm (docker stack deploy).
      replicas: 2
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      # node:20-alpine não inclui curl; usa o wget do BusyBox.
      # A API expõe /api/health (prefixo global /api).
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend Application
  frontend:
    build:
      context: .
      dockerfile: ./docker/frontend/Dockerfile
      args:
        # Necessários no build do Vite (não ficam acessíveis em runtime após o bundle).
        VITE_RECAPTCHA_SITE_KEY: ${VITE_RECAPTCHA_SITE_KEY}
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_MAINTENANCE_MODE: ${VITE_MAINTENANCE_MODE:-false}
    image: eventease-frontend:latest
    restart: always
    networks:
      - backend_network
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # NGINX Load Balancer
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
      - ./docker/nginx/ssl:/etc/nginx/ssl
      - /etc/letsencrypt:/etc/letsencrypt
    depends_on:
      - api
      - frontend
    networks:
      - backend_network
    restart: always

networks:
  backend_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
